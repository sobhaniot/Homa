<!DOCTYPE HTML>
<html>
<head>
    <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1.0"/>
    <title>Aquarium</title>
    <style>
        body {
            text-align: center;
            background : #3495ba;
            width: 100%;
            max-width: 550px;
            margin: 10px auto;
            font-family: "Arial Rounded MT Bold";
        }
        body>div{
            padding: 30px 0 30px 0;
            background-color: rgba(255, 255, 255, 0.30);
            border-radius: 15px;
        }
        h1{
            font-size: 18px;
        }
        .formWrapper>div{
            display: grid;
            grid-template-columns:4fr 6fr;
            width: 90%;
            margin: 0 auto;
        }
        .formWrapper>div label{
            background: #74b9ff;
            padding: 10px;
            border-bottom-left-radius: 5px;
            border-top-left-radius: 5px;
            margin: 10px 0 10px 10px;
            font-size: 90%;
            color: #322c27;
        }

        .TimeBox input{
            width: calc(50% - 5px);
            box-sizing: border-box;
            margin: 10px 0 10px 0;
            height: 40px;
            background: rgba(79, 255, 242, 0.6);
            font-size: 20px;
        }
        .TimeBox input:nth-child(2){
            border-bottom-right-radius: 5px;
            border-top-right-radius: 5px;
        }
        .TimeBox input:focus{
            background: rgba(88, 255, 212, 0.28);
        }
        .formbox input{
            width: calc(100% - 10px);
            box-sizing: border-box;
            margin: 10px 10px 10px 0;
            height: 40px;
            border-bottom-right-radius: 5px;
            border-top-right-radius: 5px;
            background: rgba(79, 255, 242, 0.6);
            font-size: 20px;
        }
        .formbox input:focus{
            background: rgba(88, 255, 212, 0.28);
        }
        .formWrapper>input{
            width: 80%;
            height: 40px;
            background: #6c5ce7;
            border-radius: 8px;
            color: #fff;
            font-size: 20px;
            cursor:pointer;

        }
        .formWrapper>input:hover{
            background: rgb(102, 93, 185);
        }
        .formWrapper>input:active{
            background: rgba(140, 122, 230, 0.6);
        }
    </style>
</head>
<body>
<div>
    <h1>Enter Bubble Time Work</h1>
    <form method="POST">
        <div class="formWrapper">
            <div>
                <label for="BubbleStartH">Bubble Start : </label>
                <div class="TimeBox">
                    <input id="BubbleStartH" type="number" name="BubbleStartH" checked required max="23" min="0" value="14" inputmode="numeric">
                    <input id="BubbleStartM" type="number" name="BubbleStartM" checked required max="59" min="0" value="0" inputmode="numeric">
                </div>
                <label for="BubbleEndH">Bubble End : </label>
                <div class="TimeBox">
                    <input id="BubbleEndH" type="number" name="BubbleEndH" checked required max="23" min="0" value="14" inputmode="numeric">
                    <input id="BubbleEndM" type="number" name="BubbleEndM" checked required max="23" min="0" value="0" inputmode="numeric">
                </div>
            </div>
            <input type="submit" value="Submit">
        </div>
    </form>
    <h1>Enter Filter Time Work</h1>
    <form method="POST">
        <div class="formWrapper">
            <div>
                <label for="FilterStartH">Filter Start : </label>
                <div class="TimeBox">
                    <input id="FilterStartH" type="number" name="FilterStartH" checked required max="23" min="0" value="14" inputmode="numeric">
                    <input id="FilterStartM" type="number" name="FilterStartM" checked required max="59" min="0" value="0" inputmode="numeric">
                </div>
                <label for="FilterEndH">Filter End : </label>
                <div class="TimeBox">
                    <input id="FilterEndH" type="number" name="FilterEndH" checked required max="23" min="0" value="14" inputmode="numeric">
                    <input id="FilterEndM" type="number" name="FilterEndM" checked required max="23" min="0" value="0" inputmode="numeric">
                </div>
            </div>
            <input type="submit" value="Submit">
        </div>
    </form>
</div>
<div>
    <h1>Enter SSID and PassWord Of Local WiFi</h1>
    <form method="POST">
        <div class="formWrapper">
            <div>
                <label for="ssidbox">SSID : </label>
                <div class="formbox">
                    <input id="ssidbox" type="text" name="SSIDName">
                </div>
                <label for="password">PassWord : </label>
                <div class="formbox">
                    <input id="password" type="text" name="Password">
                </div>
            </div>
            <input type="submit" value="Submit">
        </div>
    </form>
    <form method="POST">
        <div class="formWrapper">
            <div>
                <label for="brokerURL">MQTT Broker : </label>
                <div class="formbox">
                    <input id="brokerURL" type="text" name="Broker">
                </div>
            </div>
            <input type="submit" value="Save">
        </div>
    </form>
</div>
</body>
</html>
